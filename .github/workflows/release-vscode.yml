name: Release VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - "packages/vscode-extension/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Package & Publish VS Code Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension
        run: pnpm --filter pointr-vscode build

      - name: Run Tests
        run: pnpm --filter pointr-vscode test

      - name: Package VSIX
        working-directory: packages/vscode-extension
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointr-vscode-vsix
          path: packages/vscode-extension/*.vsix

      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        working-directory: packages/vscode-extension
        run: npx @vscode/vsce publish -p $VSCE_PAT --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        working-directory: packages/vscode-extension
        run: npx ovsx publish -p $OVSX_PAT $(ls *.vsix)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
