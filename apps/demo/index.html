<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pointr Demo</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
      .app { min-height: 100vh; }
      .header { padding: 1rem 2rem; border-bottom: 1px solid #1e293b; }
      nav { display: flex; justify-content: space-between; align-items: center; }
      .logo { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
      .cta-button { background: #2563eb; color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 500; }
      .hero { padding: 6rem 2rem; text-align: center; }
      .hero-title { font-size: 3rem; font-weight: 800; margin-bottom: 1rem; }
      .hero-subtitle { font-size: 1.25rem; color: #94a3b8; margin-bottom: 2rem; }
      .hero-actions { display: flex; gap: 1rem; justify-content: center; }
      .primary-button { background: #2563eb; color: white; border: none; padding: 0.75rem 2rem; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; }
      .secondary-link { color: #38bdf8; text-decoration: none; display: flex; align-items: center; font-size: 1rem; }
      .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; padding: 4rem 2rem; max-width: 1200px; margin: 0 auto; }
      .feature-card { background: #1e293b; border-radius: 12px; padding: 2rem; }
      .feature-icon { font-size: 2rem; display: block; margin-bottom: 1rem; }
      .feature-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.5rem; }
      .feature-description { color: #94a3b8; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
